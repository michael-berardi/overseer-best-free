[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overseer-free-best"
version = "0.1.0"
description = "Dynamically resolve the best free chat model on OpenRouter, with a fallback-ready ranking."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["openrouter", "llm", "free-models", "routing", "fallback"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
overseer-free-best = "overseer_free_best.__main__:main"

[project.urls]
Homepage = "https://github.com/michael-berardi/overseer-free-best"

[tool.setuptools.packages.find]
where = ["src"]
